; ============================================================
; Shared settings — applies to every environment below unless
; explicitly overridden in that environment's section.
; ============================================================
[env:esp32-s3-devkitm-1]
board = esp32-s3-devkitm-1
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
lib_deps =
	https://github.com/pschatzmann/arduino-audio-tools.git
	https://github.com/pschatzmann/arduino-audio-driver.git
	fastled/FastLED@^3.10.3
	lovyan03/LovyanGFX@^1.2.26
	z3t0/IRremote@^4.7.1
	bblanchon/ArduinoJson@^7.2.2
	knolleary/PubSubClient@^2.8
	bodmer/TFT_eSPI@^2.5.43
	paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8

; ============================================================
; Original / regular board — ESP32-S3 devkit
; (WS2812 strip, dedicated buttons, web-app-primary UX)
; ============================================================
; no extra define needed — this is the default (non-CYD) build

; ============================================================
; CYD build — ESP32-D0WD-V3 (plain ESP32, e.g. ESP32-2432S028R)
; (touchscreen-primary UX, PCF8574 expander, onboard RGB LED)
; ============================================================
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
	${env.build_flags}
	-D BOARD_CYD
	-std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
	https://github.com/pschatzmann/arduino-audio-tools.git
	https://github.com/pschatzmann/arduino-audio-driver.git
	fastled/FastLED@^3.10.3
	lovyan03/LovyanGFX@^1.2.26
	z3t0/IRremote@^4.7.1
	bblanchon/ArduinoJson@^7.2.2
	knolleary/PubSubClient@^2.8
	bodmer/TFT_eSPI@^2.5.43

; ============================================================
; ESP32-C3-LCDkit — 1.28" round GC9A01 240x240 + rotary encoder.
; No touchscreen and no LED strip: the knob is the whole interface
; (rotate = move, press = fire, long press = menu). LVGL drives the
; UI here rather than raw drawing, for the animation/anti-aliasing
; polish the round panel deserves.
;
; IR: RX on IO4, TX on IO8 (IO8's original function is given up for
; this - the board shares RX/TX on IO4 via jumper otherwise, which
; would mean learn and blast could not both work).
; ============================================================
[env:c3knob]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
; The default 4MB layout gives the app only 1.25MB (two OTA slots), and
; this firmware is ~1.30MB - it was linking at 99.7% full with 4KB spare.
; huge_app drops the second OTA slot for a single ~3MB app partition,
; which is the right trade here: this is flashed over USB, not OTA.
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; USB Serial/JTAG enumerates as a CDC device, and the monitor asserting
; DTR/RTS on it drives the chip's auto-reset lines - which on its own
; produces a repeating reset exactly like the one being debugged. Leave
; both deasserted.
monitor_rts = 0
monitor_dtr = 0
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-D BOARD_C3KNOB
	-D LV_CONF_INCLUDE_SIMPLE
	-I include
	; This board has no USB-UART bridge - it uses the C3's built-in
	; USB Serial/JTAG. Without these, Serial goes to UART0 (unconnected),
	; so neither Serial.println nor the panic handler's backtrace ever
	; reaches the monitor: you see ROM boot messages and nothing else.
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	; LVGL's render path is stack-hungry and runs from the Arduino loop
	; task, which defaults to 8KB. Overflowing it shows up as exactly this
	; kind of silent reset loop.
	-D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
	; Pin IRremote's carrier to LEDC channel 0 explicitly, so it can never
	; drift onto the backlight's channel (5, see LGX_Config_C3.h). Only has
	; an effect on Arduino core < 3.0, where the channel is a fixed
	; #define; core 3.x auto-allocates and will simply skip 5.
	-D SEND_LEDC_CHANNEL=0
lib_deps =
	; FastLED is here despite this board having no LED strip: CRGB is the
	; colour type used across the whole codebase (accent/wave colours,
	; per-button colours, the flashLeds() signature), so the header is
	; needed even though none of the driver code is compiled in.
	fastled/FastLED@^3.10.3
	lovyan03/LovyanGFX@^1.2.26
	lvgl/lvgl@^8.3.11
	z3t0/IRremote@^4.7.1
	bblanchon/ArduinoJson@^7.2.2
	knolleary/PubSubClient@^2.8

; ============================================================
; CYD touch/display debug — builds debug/cyd_touch_debug.cpp
; INSTEAD of src/ (build_src_filter excludes it), so the main
; firmware is not compiled into this at all.
;
;   pio run -e cyd-debug -t upload
;   pio device monitor -e cyd-debug
;
; Standalone: own display config, talks to the XPT2046 directly,
; ignores any stored calibration. Single-key serial commands —
; press 'h' for the list. Flash -e cyd to go back.
; ============================================================
[env:cyd-debug]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; NO monitor_filters here on purpose. esp32_exception_decoder wraps the
; serial stream and has been known to interfere with keyboard input to the
; monitor - this env is an interactive console, so input matters more than
; decoded backtraces.
; local echo - without it the keys you press are invisible, which makes a
; working console look unresponsive
monitor_echo = yes
build_src_filter = -<*> +<../debug/cyd_touch_debug.cpp>
build_flags =
	-std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
	lovyan03/LovyanGFX@^1.2.26
