; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
	fastled/FastLED@^3.10.3
	lovyan03/LovyanGFX@^1.2.26
	z3t0/IRremote@^4.7.1
	bblanchon/ArduinoJson@^7.0.0
	knolleary/PubSubClient@^2.8

; CYD - "Cheap Yellow Display" (ESP32-2432S028R): built-in ILI9341 TFT +
; XPT2046 resistive touch, no WS2812 strip, no dedicated learn/blast
; buttons. Touch becomes the primary UI (see BOARD_CYD branches in
; src/main.cpp); IR receive/transmit run directly off GPIO22/GPIO27,
; broken out on the board's CN1 header - confirmed free/unclaimed by the
; display, touch, RGB LED, speaker, SD card, or light sensor circuitry.
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
	-D BOARD_CYD
lib_deps =
	fastled/FastLED@^3.10.3
	lovyan03/LovyanGFX@^1.2.26
	z3t0/IRremote@^4.7.1
	bblanchon/ArduinoJson@^7.0.0
	knolleary/PubSubClient@^2.8

; Standalone touch/display debug sketch - builds debug/cyd_touch_debug.cpp
; INSTEAD of the main firmware (build_src_filter excludes src/). Self
; contained: its own display config, talks to the XPT2046 directly, and
; derives the touch mapping from four corner taps rather than relying on a
; stored calibration. Use when taps don't land where you press:
;   pio run -e cyd-debug -t upload
;   pio device monitor -e cyd-debug
; Flash the normal `cyd` env to go back.
[env:cyd-debug]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = -<*> +<../debug/cyd_touch_debug.cpp>
lib_deps =
	lovyan03/LovyanGFX@^1.2.26
